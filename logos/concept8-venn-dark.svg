<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-labelledby="c8-title">
  <title id="c8-title">PolicyLab Logo - Overlapping Circles</title>
  <defs>
    <linearGradient id="c8-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="c8-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="c8-grad3" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <g id="c8-icon" transform="translate(38, 40)">
    <!-- Three overlapping circles representing Policy, Economy, Society -->
    <!-- Top circle (Policy) -->
    <circle cx="0" cy="-12" r="20" fill="none" stroke="url(#c8-grad1)" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="-12" r="20" fill="#6366f1" opacity="0.08"/>

    <!-- Bottom-left circle (Economy) -->
    <circle cx="-14" cy="8" r="20" fill="none" stroke="url(#c8-grad2)" stroke-width="2" opacity="0.6"/>
    <circle cx="-14" cy="8" r="20" fill="#4f46e5" opacity="0.06"/>

    <!-- Bottom-right circle (Society) -->
    <circle cx="14" cy="8" r="20" fill="none" stroke="url(#c8-grad3)" stroke-width="2" opacity="0.6"/>
    <circle cx="14" cy="8" r="20" fill="#818cf8" opacity="0.06"/>

    <!-- Center intersection glow -->
    <circle cx="0" cy="2" r="6" fill="#6366f1" opacity="0.25"/>
    <circle cx="0" cy="2" r="3" fill="#c7d2fe" opacity="0.6"/>

    <!-- Label dots at circle centers -->
    <circle cx="0" cy="-16" r="2" fill="#a5b4fc" opacity="0.7"/>
    <circle cx="-14" cy="12" r="2" fill="#818cf8" opacity="0.6"/>
    <circle cx="14" cy="12" r="2" fill="#c7d2fe" opacity="0.6"/>
  </g>

  <g transform="translate(84, 0)">
    <text x="0" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f3f4f6" letter-spacing="-0.5">
      Policy</text>
    <text x="116" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#818cf8" letter-spacing="-0.5">
      Lab</text>
    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9ca3af" letter-spacing="3">
      POLICY SIMULATION</text>
  </g>
</svg>
