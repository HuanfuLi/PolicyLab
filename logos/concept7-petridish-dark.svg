<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-labelledby="c7-title">
  <title id="c7-title">PolicyLab Logo - Petri Dish</title>
  <defs>
    <linearGradient id="c7-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="c7-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="c7-icon" transform="translate(38, 40)">
    <!-- Dish outer rim (3D perspective - ellipse) -->
    <ellipse cx="0" cy="0" rx="32" ry="20" fill="none" stroke="url(#c7-grad)" stroke-width="2.5" opacity="0.85"/>
    <!-- Inner rim highlight -->
    <ellipse cx="0" cy="-1" rx="28" ry="17" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.25"/>
    <!-- Dish floor glow -->
    <ellipse cx="0" cy="0" rx="26" ry="15" fill="url(#c7-glow)"/>

    <!-- Agent colonies (clustered dots like organisms in a petri dish) -->
    <!-- Cluster 1 (top-left) -->
    <circle cx="-14" cy="-6" r="3.5" fill="#6366f1" opacity="0.6"/>
    <circle cx="-10" cy="-9" r="2" fill="#818cf8" opacity="0.5"/>
    <circle cx="-17" cy="-3" r="1.5" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="-11" cy="-4" r="1.5" fill="#c7d2fe" opacity="0.5"/>

    <!-- Cluster 2 (right) -->
    <circle cx="12" cy="-2" r="4" fill="#818cf8" opacity="0.55"/>
    <circle cx="16" cy="1" r="2" fill="#6366f1" opacity="0.45"/>
    <circle cx="9" cy="1" r="2" fill="#a5b4fc" opacity="0.4"/>
    <circle cx="14" cy="-6" r="1.5" fill="#c7d2fe" opacity="0.45"/>

    <!-- Cluster 3 (bottom) -->
    <circle cx="-2" cy="6" r="3" fill="#6366f1" opacity="0.5"/>
    <circle cx="3" cy="8" r="2" fill="#818cf8" opacity="0.45"/>
    <circle cx="-5" cy="9" r="1.5" fill="#a5b4fc" opacity="0.4"/>

    <!-- Interaction lines between clusters -->
    <line x1="-11" y1="-4" x2="9" y2="1" stroke="#a5b4fc" stroke-width="0.6" opacity="0.3" stroke-dasharray="2,2"/>
    <line x1="-14" y1="-6" x2="-2" y2="6" stroke="#818cf8" stroke-width="0.6" opacity="0.25" stroke-dasharray="2,2"/>
    <line x1="12" y1="-2" x2="3" y2="8" stroke="#a5b4fc" stroke-width="0.6" opacity="0.25" stroke-dasharray="2,2"/>

    <!-- Lens/magnification arc (top) -->
    <path d="M-20,-16 Q0,-28 20,-16" fill="none" stroke="#a5b4fc" stroke-width="0.8" opacity="0.2"/>
  </g>

  <g transform="translate(84, 0)">
    <text x="0" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f3f4f6" letter-spacing="-0.5">
      Policy</text>
    <text x="116" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#818cf8" letter-spacing="-0.5">
      Lab</text>
    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9ca3af" letter-spacing="3">
      POLICY SIMULATION</text>
  </g>
</svg>
