<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-labelledby="c2-title">
  <title id="c2-title">PolicyLab Logo - Globe Data</title>
  <defs>
    <linearGradient id="c2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <g id="c2-icon" transform="translate(40, 40)">
    <!-- Globe outline -->
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#c2-grad)" stroke-width="2.2" opacity="0.9"/>

    <!-- Latitude lines -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.35"/>
    <ellipse cx="0" cy="-14" rx="22" ry="6" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.25"/>
    <ellipse cx="0" cy="14" rx="22" ry="6" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.25"/>

    <!-- Meridian lines -->
    <ellipse cx="0" cy="0" rx="12" ry="30" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.35"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#6366f1" stroke-width="0.6" opacity="0.2"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#6366f1" stroke-width="0.6" opacity="0.2"/>

    <!-- Data circuit overlay nodes -->
    <circle cx="-12" cy="-10" r="2.5" fill="#a5b4fc"/>
    <circle cx="14" cy="-6" r="3" fill="#c7d2fe"/>
    <circle cx="8" cy="12" r="2.5" fill="#a5b4fc"/>
    <circle cx="-10" cy="8" r="2" fill="#818cf8"/>
    <circle cx="0" cy="-20" r="2" fill="#e0e7ff"/>

    <!-- Data circuit connections -->
    <path d="M-12,-10 L14,-6" stroke="#a5b4fc" stroke-width="1" opacity="0.5" fill="none"/>
    <path d="M14,-6 L8,12" stroke="#c7d2fe" stroke-width="1" opacity="0.5" fill="none"/>
    <path d="M8,12 L-10,8" stroke="#a5b4fc" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M-10,8 L-12,-10" stroke="#818cf8" stroke-width="1" opacity="0.4" fill="none"/>
    <path d="M0,-20 L14,-6" stroke="#e0e7ff" stroke-width="0.8" opacity="0.35" fill="none"/>
    <path d="M0,-20 L-12,-10" stroke="#e0e7ff" stroke-width="0.8" opacity="0.35" fill="none"/>

    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#4f46e5" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(84, 0)">
    <text x="0" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f3f4f6" letter-spacing="-0.5">
      Policy</text>
    <text x="116" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#818cf8" letter-spacing="-0.5">
      Lab</text>
    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9ca3af" letter-spacing="3">
      POLICY SIMULATION</text>
  </g>
</svg>
