<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80" role="img" aria-labelledby="c3-title">
  <title id="c3-title">PolicyLab Logo - Molecular Network</title>
  <defs>
    <linearGradient id="c3-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <radialGradient id="c3-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </radialGradient>
  </defs>

  <g id="c3-icon" transform="translate(38, 40)">
    <!-- Outer ring of agent nodes -->
    <!-- Top -->
    <circle cx="0" cy="-26" r="4" fill="#6366f1" opacity="0.7"/>
    <!-- Top-right -->
    <circle cx="22" cy="-14" r="3.5" fill="#818cf8" opacity="0.65"/>
    <!-- Right -->
    <circle cx="26" cy="6" r="3" fill="#6366f1" opacity="0.6"/>
    <!-- Bottom-right -->
    <circle cx="16" cy="22" r="3.5" fill="#818cf8" opacity="0.65"/>
    <!-- Bottom-left -->
    <circle cx="-16" cy="22" r="3" fill="#6366f1" opacity="0.6"/>
    <!-- Left -->
    <circle cx="-26" cy="4" r="3.5" fill="#818cf8" opacity="0.65"/>
    <!-- Top-left -->
    <circle cx="-20" cy="-16" r="3" fill="#6366f1" opacity="0.6"/>

    <!-- Connections to center (policy hub) -->
    <line x1="0" y1="-26" x2="0" y2="0" stroke="#818cf8" stroke-width="1.2" opacity="0.3"/>
    <line x1="22" y1="-14" x2="0" y2="0" stroke="#818cf8" stroke-width="1.2" opacity="0.3"/>
    <line x1="26" y1="6" x2="0" y2="0" stroke="#6366f1" stroke-width="1" opacity="0.25"/>
    <line x1="16" y1="22" x2="0" y2="0" stroke="#818cf8" stroke-width="1.2" opacity="0.3"/>
    <line x1="-16" y1="22" x2="0" y2="0" stroke="#6366f1" stroke-width="1" opacity="0.25"/>
    <line x1="-26" y1="4" x2="0" y2="0" stroke="#818cf8" stroke-width="1.2" opacity="0.3"/>
    <line x1="-20" y1="-16" x2="0" y2="0" stroke="#6366f1" stroke-width="1" opacity="0.25"/>

    <!-- Inter-node connections (peer interactions) -->
    <line x1="0" y1="-26" x2="22" y2="-14" stroke="#a5b4fc" stroke-width="0.6" opacity="0.25"/>
    <line x1="22" y1="-14" x2="26" y2="6" stroke="#a5b4fc" stroke-width="0.6" opacity="0.25"/>
    <line x1="26" y1="6" x2="16" y2="22" stroke="#a5b4fc" stroke-width="0.6" opacity="0.2"/>
    <line x1="16" y1="22" x2="-16" y2="22" stroke="#a5b4fc" stroke-width="0.6" opacity="0.2"/>
    <line x1="-16" y1="22" x2="-26" y2="4" stroke="#a5b4fc" stroke-width="0.6" opacity="0.25"/>
    <line x1="-26" y1="4" x2="-20" y2="-16" stroke="#a5b4fc" stroke-width="0.6" opacity="0.2"/>
    <line x1="-20" y1="-16" x2="0" y2="-26" stroke="#a5b4fc" stroke-width="0.6" opacity="0.25"/>

    <!-- Central hub (policy engine) -->
    <circle cx="0" cy="0" r="8" fill="url(#c3-core)" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#e0e7ff"/>

    <!-- Pulse rings -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#6366f1" stroke-width="0.6" opacity="0.15"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#4f46e5" stroke-width="0.4" opacity="0.1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(84, 0)">
    <text x="0" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#f3f4f6" letter-spacing="-0.5">
      Policy</text>
    <text x="116" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="32" font-weight="700" fill="#818cf8" letter-spacing="-0.5">
      Lab</text>
    <text x="0" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#9ca3af" letter-spacing="3">
      POLICY SIMULATION</text>
  </g>
</svg>
